server.port=8085
spring.application.name=claim-service

# MongoDB
spring.data.mongodb.uri=mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/claims_db

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Config propia del servicio
claims.otp.ttl-minutes=5
claims.otp.max-attempts=3
claims.fraud.max-claims-per-day=3
claims.fraud.min-description-length=20
claims.fraud.suspicious-threshold=50
claims.resolve.allowed-roles=ADMIN
